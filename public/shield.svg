<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Outline -->
  <path d="M24 4L8 10V22C8 32.5 14.8 41.8 24 44C33.2 41.8 40 32.5 40 22V10L24 4Z" fill="#030712" stroke="#0e7490" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Inner Shield Gradient -->
  <path d="M24 7L11 12V22C11 30.8 16.6 38.8 24 40.8C31.4 38.8 37 30.8 37 22V12L24 7Z" fill="url(#shieldGrad)" fill-opacity="0.35" stroke="url(#glowGrad)" stroke-width="1.5" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Tactical Reticle / Chevron Details -->
  <path d="M24 13L17 19H31L24 13Z" fill="#22d3ee" fill-opacity="0.85" />
  <path d="M24 22V34" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M18 27L24 33L30 27" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Target Core Dot -->
  <circle cx="24" cy="22" r="2.5" fill="#a5f3fc" />
  <circle cx="24" cy="22" r="4.5" stroke="#22d3ee" stroke-width="0.75" stroke-dasharray="2 1.5" />
</svg>
